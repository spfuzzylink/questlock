name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source:
    name: Public source and history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test publication guard
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Inspect tracked source and full reachable history
        run: python3 scripts/check-public-source.py
  go:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux/amd64
            suffix: linux_amd64
          - os: ubuntu-24.04-arm
            target: linux/arm64
            suffix: linux_arm64
          - os: macos-15-intel
            target: darwin/amd64
            suffix: darwin_amd64
          - os: macos-15
            target: darwin/arm64
            suffix: darwin_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Test installer and archive boundaries
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build release archive
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/package.py --target "$PACKAGE_TARGET"
      - name: Verify and exercise the packaged executable
        env:
          PACKAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum -c checksums.txt
          else
            shasum -a 256 -c checksums.txt
          fi
          mkdir unpacked
          tar -xzf "questlock_$(cat ../VERSION)_${PACKAGE_SUFFIX}.tar.gz" -C unpacked
          test "$(unpacked/questlock version)" = "$(cat ../VERSION)"
          unpacked/questlock --help
          unpacked/questlock quest
          unpacked/questlock model quest
          unpacked/questlock outcome quest
          unpacked/questlock model runtime-quest
          unpacked/questlock revise quest
          unpacked/questlock worker --help 2>&1 | grep -F 'questlock worker serve'
          unpacked/questlock model evaluate --suite unpacked/evaluation/fixtures/quickstart.json > evaluation.json
          python3 - <<'PY'
          import json
          with open("evaluation.json") as stream:
              report = json.load(stream)
          assert report["mode"] == "fixture" and report["selection"]["configuration_id"] == "balanced-256"
          assert report["selection"]["scope"] == "simulated_fixture_suite_only"
          rows = {(row["configuration_id"], row["case_id"]): row for row in report["results"]}
          assert len(rows) == len(report["results"]) == 12
          assert {key for key, row in rows.items() if not row["eligible"]} == {("compact-64", "incident-handoff"), ("compact-64", "release-readiness")}
          assert all(row["first"]["timing_source"] == "simulated_fixture" for row in rows.values())
          incomplete = rows["compact-64", "incident-handoff"]
          assert not incomplete["first"]["complete"] and incomplete["first"]["error_category"] == "incomplete" and "reuse" not in incomplete
          wrong = rows["compact-64", "release-readiness"]
          assert not wrong["first"]["quality_passed"] and not wrong["reuse"]["quality_passed"]
          reuses = [row for row in rows.values() if "reuse" in row]
          assert len(reuses) == 11
          for row in reuses:
              reuse = row["reuse"]
              assert reuse["reused"] and reuse["complete"] and reuse["durable"]
              assert all(value == 0 for value in reuse["this_run_usage"].values())
              assert reuse["avoided_usage"] == row["first"]["this_run_usage"] and reuse["output_sha256"] == row["first"]["output_sha256"]
          print("Verified all public archive fixtures and result reuse offline.")
          PY
      - name: Verify packaged first task and exact reuse in fresh state
        run: |
          questlock_packaged_bin="$PWD/dist/unpacked/questlock"
          questlock_smoke_root="$(mktemp -d "${RUNNER_TEMP}/questlock-onboarding.XXXXXX")"
          questlock_smoke_state="$questlock_smoke_root/state"
          questlock_smoke_workspace="$questlock_smoke_root/requests"
          trap '"$questlock_packaged_bin" local stop --state-dir "$questlock_smoke_state" >/dev/null 2>&1 || true' EXIT
          "$questlock_packaged_bin" try --state-dir "$questlock_smoke_state" \
            --workspace "$questlock_smoke_workspace" > "$questlock_smoke_root/first.json"
          "$questlock_packaged_bin" try --state-dir "$questlock_smoke_state" \
            --workspace "$questlock_smoke_workspace" > "$questlock_smoke_root/reused.json"
          python3 - "$questlock_smoke_root/first.json" "$questlock_smoke_root/reused.json" <<'PY'
          import json
          import sys
          reports = [json.load(open(path)) for path in sys.argv[1:]]
          for report in reports:
              assert report["status"] == "completed" and report["mcp_protocol_self_test"]
              assert report["native_client_verified"] is False
              assert set(report["mcp_tools"]) == {"questlock_revise", "questlock_delegate"}
              result = report["result"]
              assert result["status"] == "completed" and result["durable"]
              assert result["text"] == '{"status":"ready","model_calls":0}'
              assert result["generation_called"] is False and result["provider_cost_usd"] == 0
              assert all(value == 0 for value in result["this_run_usage"].values())
              assert all(check["passed"] for check in result["source_checks"] + result["checks"])
              assert result["artifact"]["version"] == 1
              assert result["outcome_tracking"]["status"] == "recorded"
          first, reused = [report["result"] for report in reports]
          assert first["reused"] is False and first["cost_basis"] == "deterministic_edit"
          assert reused["reused"] and reused["cost_basis"] == "reuse_zero"
          assert first["artifact"] == reused["artifact"]
          print("Verified packaged MCP first task and exact reuse without model generation.")
          PY
      - name: Build and inspect native Desktop bundle without opening the app
        if: startsWith(matrix.target, 'darwin/')
        env:
          PACKAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          questlock_packaged_bin="$PWD/dist/unpacked/questlock"
          questlock_desktop_home="$(mktemp -d "${RUNNER_TEMP}/questlock-desktop.XXXXXX")"
          questlock_desktop_state="$questlock_desktop_home/state"
          questlock_desktop_workspace="$questlock_desktop_home/requests"
          questlock_desktop_bundle="$PWD/dist/questlock_$(cat VERSION)_${PACKAGE_SUFFIX}.mcpb"
          trap '"$questlock_packaged_bin" local stop --state-dir "$questlock_desktop_state" >/dev/null 2>&1 || true' EXIT
          "$questlock_packaged_bin" setup --client claude-desktop --no-open \
            --home "$questlock_desktop_home" --state-dir "$questlock_desktop_state" \
            --workspace "$questlock_desktop_workspace" --bundle "$questlock_desktop_bundle" \
            > "$questlock_desktop_home/setup.json"
          python3 - "$questlock_desktop_home/setup.json" "$questlock_desktop_bundle" "$questlock_packaged_bin" "$PACKAGE_SUFFIX" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          import zipfile
          report_path, bundle_path, binary_path, suffix = sys.argv[1:]
          report = json.loads(Path(report_path).read_text())
          assert report["status"] == "native_install_required"
          bundle = report["desktop_bundle"]
          assert bundle["native_validation_required"] is True and bundle["desktop_native_supported"] is True
          assert bundle["platform"] == "darwin" and bundle["architecture"] == suffix.removeprefix("darwin_")
          assert bundle["sha256"] == hashlib.sha256(Path(bundle_path).read_bytes()).hexdigest()
          first = report["first_task"]
          assert first["status"] == "completed" and first["mcp_protocol_self_test"]
          assert first["native_client_verified"] is False
          assert first["result"]["durable"] and first["result"]["generation_called"] is False
          assert first["result"]["provider_cost_usd"] == 0
          assert all(value == 0 for value in first["result"]["this_run_usage"].values())
          with zipfile.ZipFile(bundle_path) as archive:
              expected = {"manifest.json", "server/questlock", "LICENSE", "ATTRIBUTION.md", "THIRD_PARTY_NOTICES.md"}
              assert set(archive.namelist()) == expected and len(archive.namelist()) == len(expected)
              manifest = json.loads(archive.read("manifest.json"))
              assert manifest["manifest_version"] == "0.3" and manifest["server"]["type"] == "binary"
              assert manifest["server"]["entry_point"] == "server/questlock"
              assert manifest["compatibility"]["platforms"] == ["darwin"]
              assert archive.getinfo("server/questlock").external_attr >> 16 & 0o777 == 0o755
              assert hashlib.sha256(archive.read("server/questlock")).digest() == hashlib.sha256(Path(binary_path).read_bytes()).digest()
              assert all(archive.read(name).strip() for name in expected - {"manifest.json", "server/questlock"})
          print("Verified Desktop bundle contents and protocol only; native app connection remains unverified.")
          PY
      - name: Retain tested packages for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: questlock-${{ matrix.suffix }}
          path: |
            dist/*.tar.gz
            dist/*.mcpb
          if-no-files-found: error
          retention-days: 7
  source-container:
    name: Build and exercise source container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify Docker excludes local state and metadata
        run: python3 scripts/check-container-context.py
      - name: Build from the actual filtered checkout context
        run: docker build --file Containerfile --tag questlock-source:ci .
      - name: Verify source image metadata and offline scenarios
        run: |
          image=questlock-source:ci
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = '65532:65532'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.authors"}}' "$image")" = '@spfuzzylink (https://github.com/spfuzzylink)'
          test "$(docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --memory=256m --cpus=1 --pids-limit=128 "$image" version)" = "$(cat VERSION)"
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=256m --cpus=1 --pids-limit=128 \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=64m,mode=1777 "$image" quest
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=256m --cpus=1 --pids-limit=128 \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=64m,mode=1777 "$image" model quest
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=256m --cpus=1 --pids-limit=128 \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=64m,mode=1777 "$image" outcome quest
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=256m --cpus=1 --pids-limit=128 \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=64m,mode=1777 "$image" model runtime-quest
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=256m --cpus=1 --pids-limit=128 \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=64m,mode=1777 "$image" revise quest
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=256m --cpus=1 --pids-limit=128 \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=64m,mode=1777 "$image" model evaluate > evaluation.json
          python3 - <<'PY'
          import json
          with open("evaluation.json") as stream:
              report = json.load(stream)
          assert report["mode"] == "fixture" and report["selection"]["configuration_id"] == "balanced-256"
          assert report["selection"]["scope"] == "simulated_fixture_suite_only"
          rows = {(row["configuration_id"], row["case_id"]): row for row in report["results"]}
          assert len(rows) == len(report["results"]) == 12
          assert {key for key, row in rows.items() if not row["eligible"]} == {("compact-64", "incident-handoff"), ("compact-64", "release-readiness")}
          assert all(row["first"]["timing_source"] == "simulated_fixture" for row in rows.values())
          incomplete = rows["compact-64", "incident-handoff"]
          assert not incomplete["first"]["complete"] and incomplete["first"]["error_category"] == "incomplete" and "reuse" not in incomplete
          wrong = rows["compact-64", "release-readiness"]
          assert not wrong["first"]["quality_passed"] and not wrong["reuse"]["quality_passed"]
          reuses = [row for row in rows.values() if "reuse" in row]
          assert len(reuses) == 11
          for row in reuses:
              reuse = row["reuse"]
              assert reuse["reused"] and reuse["complete"] and reuse["durable"]
              assert all(value == 0 for value in reuse["this_run_usage"].values())
              assert reuse["avoided_usage"] == row["first"]["this_run_usage"] and reuse["output_sha256"] == row["first"]["output_sha256"]
          print("Verified embedded offline evaluation in the source image.")
          PY
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=256m --cpus=1 --pids-limit=128 "$image" worker --help 2>&1 | grep -F 'questlock worker serve'
      - name: Verify managed onboarding in the network-isolated source container
        run: |
          questlock_container_name="questlock-onboarding-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$questlock_container_name" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=10s 90s docker run --rm --name "$questlock_container_name" \
            --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=256m --cpus=1 --pids-limit=128 \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=64m,mode=1777 \
            questlock-source:ci try --state-dir /data/onboard/state \
            --workspace /data/onboard/requests > onboarding-container.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("onboarding-container.json").read_text())
          assert report["status"] == "completed" and report["mcp_protocol_self_test"]
          assert report["native_client_verified"] is False
          assert set(report["mcp_tools"]) == {"questlock_revise", "questlock_delegate"}
          result = report["result"]
          assert result["status"] == "completed" and result["durable"] and result["reused"] is False
          assert result["text"] == '{"status":"ready","model_calls":0}'
          assert result["generation_called"] is False and result["provider_cost_usd"] == 0
          assert all(value == 0 for value in result["this_run_usage"].values())
          assert all(check["passed"] for check in result["source_checks"] + result["checks"])
          assert result["artifact"]["version"] == 1 and result["outcome_tracking"]["status"] == "recorded"
          print("Verified source-container onboarding with loopback only and zero model generation.")
          PY
  langfuse-contract:
    name: Verify real self-hosted Langfuse acknowledgment
    uses: ./.github/workflows/langfuse.yml
  release:
    name: Publish tested experimental release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [public-source, go, source-container, langfuse-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: questlock-*
          path: dist
          merge-multiple: true
      - name: Create checksum manifest
        run: |
          cd dist
          python3 - <<'PY'
          from pathlib import Path
          version = Path("../VERSION").read_text().strip()
          archives = {f"questlock_{version}_{target}.tar.gz" for target in ("linux_amd64", "linux_arm64", "darwin_amd64", "darwin_arm64")}
          bundles = {f"questlock_{version}_{target}.mcpb" for target in ("darwin_amd64", "darwin_arm64")}
          assert {path.name for path in Path(".").glob("*.tar.gz")} == archives
          assert {path.name for path in Path(".").glob("*.mcpb")} == bundles
          PY
          sha256sum *.tar.gz *.mcpb > checksums.txt
          sha256sum -c checksums.txt
      - name: Publish archives from successful platform jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.mcpb dist/checksums.txt
          --verify-tag --prerelease --title "Questlock ${RELEASE_TAG}"
          --notes-file docs/release-notes.md
