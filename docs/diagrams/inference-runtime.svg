<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">Questlock inference runtime</title>
<desc id="desc">Published v0.3.0 experimental architecture. Explicit approved snapshots enter the Go inference runtime through CLI or MCP. The runtime calls local Ollama or direct hosted adapters and coordinates durable state with the broker. Optional local-first delegation permits one explicit escalation only after a complete durable known-usage answer fails checks. Current-run measurements, answer delivery, and content-free optional Langfuse export remain distinct.</desc>
