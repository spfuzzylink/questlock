<text x="368" y="457" font-size="19" font-weight="700">Existing Publish CAS</text>
<text x="368" y="493" font-size="16">Version + receipt + journal</text>
<text x="40" y="55" font-size="30" font-weight="700">SecondGate: one authority, durable edges</text>
<text x="40" y="84" font-size="18">Pinned durable intent; atomic pull cache; existing CAS and operation receipts.</text>
<text x="40" y="133" font-size="18" font-weight="700">READ: token-authorized artifact content</text>
<text x="350" y="329" font-size="16">Commit once on the same authority</text>
<text x="40" y="396" font-size="18" font-weight="700">PUSH: durable intent, same authoritative CAS</text>
<text x="650" y="442" font-size="18">Lost response stays uncertain until exact retry.</text>
<text x="650" y="472" font-size="18">Conflicts require an explicit caller decision.</text>
<text x="650" y="502" font-size="18">Local fixtures; real two-host validation pending.</text>
<text x="40" y="584" font-size="18">Pages contain raw artifact content. Remote endpoints require HTTPS.</text>
<text x="40" y="614" font-size="18">One authoritative database; no multi-writer replication or demonstrated remote scale.</text>
