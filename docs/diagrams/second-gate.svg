<text x="368" y="192" font-size="21" font-weight="700">Snapshot</text>
<text x="368" y="228" font-size="16">Latest version per key</text>
<text x="368" y="252" font-size="16">Fixed horizon; key order</text>
<text x="368" y="276" font-size="16">Bounded; signed cursor</text>
<rect x="650" y="155" width="235" height="145" rx="12" fill="#e8f7ee" stroke="#278461" stroke-width="2"/>
<text x="668" y="192" font-size="21" font-weight="700">Accepted changes</text>
<text x="668" y="228" font-size="16">Frozen batch horizon</text>
<text x="668" y="252" font-size="16">Sequence order</text>
<text x="668" y="276" font-size="16">No replay/rejection entries</text>
<rect x="950" y="155" width="245" height="145" rx="12" fill="#eef0ff" stroke="#7970c2" stroke-width="2"/>
<text x="968" y="192" font-size="21" font-weight="700">Reader checkpoint</text>
<text x="968" y="228" font-size="16">Atomic page + cursor</text>
<text x="968" y="252" font-size="16">Stage before promotion</text>
<text x="968" y="276" font-size="16">Resume after restart</text>
