<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-labelledby="title desc">
<title id="title">SecondGate: one authority, durable edges</title>
<desc id="desc">One authoritative SQLite store exports token-scoped snapshots and accepted changes to a private edge cache with atomic checkpoints. A pinned durable outbox forwards exact intent through the existing publication CAS, receipts and accepted journal. Pages carry raw artifact content; remote endpoints require HTTPS. Actual two-host validation remains pending.</desc>
<defs><marker id="read-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#61718d"/></marker><marker id="write-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#bd8543"/></marker></defs>
<rect width="1240" height="640" rx="18" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#18243b">
