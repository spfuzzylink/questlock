<marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#9d7dff"/></marker>
</defs>
<rect width="1440" height="980" rx="20" fill="#080c19"/>
