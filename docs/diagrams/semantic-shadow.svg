<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">Questlock: semantic shadow observations</title>
<desc id="desc">Exact reuse serves the existing checked answer without embeddings. A fresh checked answer is served normally; an optional shadow observer then binds scope and task facts, embeds locally, queries valid older sources and indexes the new source in the same SQLite broker. Only candidate diagnostics return. No semantic answer is served and no generation is avoided.</desc>
