<text x="80" y="588" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">Verify checks, durable publication, and reuse.</text>
<text x="80" y="619" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">The tool returns text; the caller applies it.</text>
