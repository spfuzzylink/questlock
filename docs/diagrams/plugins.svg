<path d="M 340 225 L 400 225" fill="none" stroke="#506381" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 340 355 L 400 355" fill="none" stroke="#506381" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 720 290 L 780 290" fill="none" stroke="#506381" stroke-width="2" marker-end="url(#arrow)"/>
