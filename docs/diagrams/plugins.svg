<rect x="60" y="310" width="280" height="90" rx="12" fill="#e8f7ee" stroke="#278461" stroke-width="2"/>
<text x="80" y="351" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#18243b">Offline platform ZIP</text>
<text x="80" y="387" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">Includes pinned binary</text>
<rect x="400" y="180" width="320" height="220" rx="12" fill="#eef0ff" stroke="#7970c2" stroke-width="2"/>
<text x="420" y="220" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18243b">Native plugin manager</text>
<text x="420" y="257" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">Codex / ChatGPT local</text>
<text x="420" y="288" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">or Claude Code</text>
<text x="420" y="319" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">Loads skill + local MCP</text>
<rect x="780" y="180" width="340" height="220" rx="12" fill="#18243b" stroke="#18243b" stroke-width="2"/>
<text x="800" y="221" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">Packaged launcher</text>
<text x="800" y="257" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff">Pinned Questlock runtime</text>
<text x="800" y="288" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff">ZIP binary or verified download</text>
<text x="800" y="319" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff">No active config rewrite</text>
<text x="800" y="350" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff">Paid fallback disabled</text>
<rect x="1180" y="180" width="360" height="220" rx="12" fill="#e8f7ee" stroke="#278461" stroke-width="2"/>
