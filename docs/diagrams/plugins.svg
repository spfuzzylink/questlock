<path d="M 1360 400 L 1360 480" fill="none" stroke="#506381" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1180 350 L 1150 350 L 1150 565 L 1120 565" fill="none" stroke="#506381" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6" marker-start="url(#arrow)"/>
