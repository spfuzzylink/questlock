<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Questlock plugin route</title>
<desc id="desc">Git catalogs or an offline platform ZIP feed the native Codex, local ChatGPT, or Claude Code plugin manager. A pinned launcher starts a private worker and broker for a checked revision and exact repeat without new generation. Dashed optional approved requests reach a configured local model; paid fallback is disabled. Claude Desktop MCPB installation is separate, and public directory review is still required.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#506381"/></marker></defs>
