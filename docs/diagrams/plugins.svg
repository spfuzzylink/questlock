<text x="800" y="588" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">Configured local model only</text>
<text x="800" y="619" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">Explicit request; no paid tier</text>
<rect x="1180" y="480" width="360" height="200" rx="12" fill="#e8f7ee" stroke="#278461" stroke-width="2"/>
<text x="1200" y="520" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18243b">First revision + exact reuse</text>
<text x="1200" y="557" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">questlock_revise</text>
<text x="1200" y="588" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">first-task.json, twice</text>
<text x="1200" y="619" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">Same immutable artifact</text>
<text x="1200" y="653" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18243b">0 new generation calls</text>
<rect x="60" y="750" width="660" height="140" rx="12" fill="#eef0ff" stroke="#7970c2" stroke-width="2"/>
<text x="80" y="790" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18243b">Separate Claude Desktop route</text>
<text x="80" y="827" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">Native .mcpb extension installation</text>
<text x="80" y="858" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">Independent of this Claude Code plugin catalog</text>
<rect x="780" y="750" width="760" height="140" rx="12" fill="#ffffff" stroke="#c2cbd8" stroke-width="2"/>
<text x="800" y="790" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18243b">Public directory: review still required</text>
<text x="800" y="827" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">Repository catalogs do not establish a public listing.</text>
<text x="800" y="858" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">This route does not claim hosted web connectors.</text>
<text x="60" y="940" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#34445e">Solid arrows: checked revision path. Dashed: explicitly approved requests to a configured local model.</text>
<text x="60" y="971" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#34445e">No hosted paid fallback. Normal hosted-chat allowances and local compute costs still apply.</text>
