<text x="1200" y="257" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">Reviewed request files</text>
<text x="1200" y="288" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b">Managed loopback service</text>
