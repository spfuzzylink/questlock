<text x="310.0" y="369" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#f1f4fc" text-anchor="middle">One pinned provider; no fallback</text>
<text x="310.0" y="393" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#f1f4fc" text-anchor="middle">Operator input reservation bound</text>
