<rect width="1200" height="900" fill="#0c1120"/>
<g font-family="Arial, sans-serif" fill="#f1f4fc"><text x="40" y="42" font-size="28" font-weight="700">Questlock: reuse across task and runtime layers</text><text x="40" y="70" font-size="17" fill="#aeb9d0">v0.5.0 experimental · compute reuse and billing stay separate</text></g>
<path d="M330 142.5 L420 142.5" fill="none" stroke="#939bb8" stroke-width="2" marker-end="url(#arrow)"/>
