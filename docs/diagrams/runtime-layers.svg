<text x="320.0" y="472.5" font-family="Arial, sans-serif" font-size="14" fill="#b8c3db" text-anchor="middle">One completion</text>
<path d="M895.0 420 L895.0 525" fill="none" stroke="#939bb8" stroke-width="2" marker-end="url(#arrow)"/>
