<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Questlock runtime layers, v0.5.0 experimental</title>
<desc id="desc">Questlock coordinates bounded tasks and shared results. OpenRouter routes hosted generation. SGLang owns KV tensors. HiSparse direct decode is inspection only. All cache counters remain separate from billing.</desc>
