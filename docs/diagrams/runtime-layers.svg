<text x="895.0" y="369" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#f1f4fc" text-anchor="middle">Inspect → tokenize → exact input IDs</text>
<text x="895.0" y="393" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#f1f4fc" text-anchor="middle">Standalone dense / HiCache generation</text>
<rect x="130" y="525" width="360" height="90" rx="12" fill="#17243b" stroke="#74d8c5"/>
<text x="310.0" y="555" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f1f4fc" text-anchor="middle">Hosted model provider</text>
<text x="310.0" y="579" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#f1f4fc" text-anchor="middle">Native usage / caller cost estimates</text>
<rect x="700" y="525" width="390" height="105" rx="12" fill="#17243b" stroke="#74d8c5"/>
<text x="895.0" y="555" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f1f4fc" text-anchor="middle">SGLang owns runtime KV</text>
<text x="895.0" y="579" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#f1f4fc" text-anchor="middle">L1 device / L2 host / optional L3</text>
<text x="895.0" y="603" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#f1f4fc" text-anchor="middle">Only configured L3 can be shared</text>
<rect x="420" y="725" width="340" height="80" rx="12" fill="#17243b" stroke="#74d8c5"/>
<text x="590.0" y="755" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f1f4fc" text-anchor="middle">Checks + explicit human outcomes</text>
<text x="590.0" y="779" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#f1f4fc" text-anchor="middle">Acceptance / rewrites / effort</text>
<text x="40" y="855" font-family="Arial, sans-serif" font-size="17" fill="#d4c2f3">HiSparse PD decode: read-only inspection here; generation requires a separately validated PD ingress.</text>
<text x="40" y="882" font-family="Arial, sans-serif" font-size="16" fill="#aeb9d0">Protocol fixtures ≠ predicted simulation ≠ Apple inference ≠ measured GPU acceleration.</text>
