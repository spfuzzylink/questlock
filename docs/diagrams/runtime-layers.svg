<text x="590.0" y="149" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#f1f4fc" text-anchor="middle">Claim / reuse / budget / outcome</text>
<rect x="850" y="95" width="300" height="95" rx="12" fill="#17243b" stroke="#74d8c5"/>
