<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc">
<title id="title">Questlock: controlled answer reuse</title>
<desc id="desc">Exact original answers skip embedding and verifier inference. On a miss, the runner claims the target task before retrieving related questions. Source provenance, protected terms, current checks and a local validity verifier must pass before a durable source alias can serve the answer. A known miss or rejection proceeds to fresh local generation. Pending, uncertain and unconfirmed outcomes stop. All validation overhead is counted separately.</desc>
<defs>
<marker id="arrow-mint" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#93f9e5"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#9d7dff"/></marker>
</defs>
<rect width="1440" height="1160" rx="20" fill="#080c19"/>
<text x="60" y="66" font-family="Arial, sans-serif" font-size="31" fill="#f4f3ff" font-weight="700">Questlock: controlled answer reuse</text>
<text x="60" y="105" font-family="Arial, sans-serif" font-size="19" fill="#cbc6e2">Retrieve a related question. Serve its answer only while it satisfies the current request.</text>
