<text x="1010" y="410" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">Same task + master candidate</text>
<text x="1010" y="431" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">No other reviewer votes</text>
<text x="1010" y="454" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">JSON mode: parsed candidate value</text>
<path d="M340,545 L450,545" fill="none" stroke="#64ddc0" stroke-width="2" marker-end="url(#arrow)" />
<path d="M750,545 L860,545" fill="none" stroke="#64ddc0" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="510" width="300" height="70" rx="11" fill="#172740" stroke="#64ddc0" stroke-width="1.5" />
<text x="190" y="536" text-anchor="middle" fill="#eff5ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Each role waits for capacity</text>
<text x="190" y="559" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13">CPU/memory + invocation deadline</text>
<rect x="450" y="510" width="300" height="70" rx="11" fill="#172740" stroke="#64ddc0" stroke-width="1.5" />
<text x="600" y="532" text-anchor="middle" fill="#eff5ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Claim + local inference</text>
<text x="600" y="553" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13">Optional JSON + bounded reasoning</text>
<text x="600" y="573" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13">Total output cap includes reasoning</text>
<rect x="860" y="510" width="300" height="70" rx="11" fill="#172740" stroke="#64ddc0" stroke-width="1.5" />
<text x="1010" y="532" text-anchor="middle" fill="#eff5ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Release + check result</text>
<text x="1010" y="553" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13">Optional keep_alive: 0 releases model</text>
<text x="1010" y="573" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13">Final text only; raw thinking discarded</text>
<rect x="40" y="600" width="1120" height="95" rx="11" fill="#172740" stroke="#efbd73" stroke-width="1.5" />
<text x="600" y="634" text-anchor="middle" fill="#eff5ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Uncertain, rejected or expired? Stop.</text>
<text x="600" y="660" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">No automatic takeover, regeneration, or paid fallback.</text>
<text x="600" y="681" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">Inspect the original record before approving a new revision.</text>
<text x="600" y="717" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13">HTTPS + distinct scoped bearer credentials; workers never mount the broker database.</text>
<text x="600" y="741" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13">Isolated-node qualification uses one physical host. Physical multi-machine deployment needs its own validation.</text>
</svg>
