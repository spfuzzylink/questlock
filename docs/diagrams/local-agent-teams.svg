<text x="385" y="190" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="12">Approved bytes</text>
<path d="M750,207 L880,207" fill="none" stroke="#64ddc0" stroke-width="2" marker-end="url(#arrow)" />
<text x="815" y="190" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="12">All gates pass</text>
<path d="M190,350 L190,300 L520,300 L520,260" fill="none" stroke="#64ddc0" stroke-width="2" marker-end="url(#arrow)" />
<path d="M600,350 L600,260" fill="none" stroke="#64ddc0" stroke-width="2" marker-end="url(#arrow)" />
<path d="M1010,350 L1010,300 L680,300 L680,260" fill="none" stroke="#64ddc0" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="155" width="280" height="105" rx="11" fill="#172740" stroke="#64ddc0" stroke-width="1.5" />
<text x="180" y="189" text-anchor="middle" fill="#eff5ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Approved task snapshot</text>
<text x="180" y="215" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">Facts + checks + pinned local model</text>
<text x="180" y="236" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">Explicit revision and reuse window</text>
<rect x="450" y="155" width="300" height="105" rx="11" fill="#172740" stroke="#64ddc0" stroke-width="1.5" />
<text x="600" y="189" text-anchor="middle" fill="#eff5ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Authoritative broker</text>
<text x="600" y="215" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">Scoped CAS claims + durable results</text>
<text x="600" y="236" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">Only this host owns SQLite</text>
<rect x="880" y="155" width="280" height="105" rx="11" fill="#172740" stroke="#64ddc0" stroke-width="1.5" />
<text x="1020" y="189" text-anchor="middle" fill="#eff5ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Checked answer</text>
<text x="1020" y="215" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">Master checks + every review pass</text>
<text x="1020" y="236" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">Exact repeat: no generation</text>
<rect x="40" y="350" width="300" height="140" rx="11" fill="#172740" stroke="#ab95ef" stroke-width="1.5" />
<text x="190" y="384" text-anchor="middle" fill="#eff5ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Node A · master</text>
<text x="190" y="410" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">Local Ollama or native Codex OSS</text>
<text x="190" y="431" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">Admission before durable claim</text>
<text x="190" y="454" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13">Ollama: types + source guidance</text>
<rect x="450" y="350" width="300" height="140" rx="11" fill="#172740" stroke="#ab95ef" stroke-width="1.5" />
<text x="600" y="384" text-anchor="middle" fill="#eff5ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Node B · correctness</text>
<text x="600" y="410" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">Same task + master candidate</text>
<text x="600" y="431" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">No other reviewer votes</text>
<text x="600" y="454" text-anchor="middle" fill="#bdcbe0" font-family="Arial,sans-serif" font-size="13" font-weight="400">JSON mode: parsed candidate value</text>
