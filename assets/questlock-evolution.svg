<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Questlock: shared state, less repeated model work</title>
  <desc id="desc">Questlock v0.2.0, experimental. A teal and violet gate sigil introduces the evolution from shared agent state to bounded model work with OpenAI, Claude, and local Ollama. The workflow is approve, claim, generate, then reuse an eligible answer while its approved snapshot remains valid.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#080c19"/>
      <stop offset="1" stop-color="#15122d"/>
    </linearGradient>
    <linearGradient id="edge" x2="1" y2="1">
      <stop stop-color="#93f9e5"/>
      <stop offset="1" stop-color="#9d7dff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7780ba" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="278" rx="19" fill="none" stroke="#373454"/>
  <rect x="20" y="20" width="1160" height="240" rx="12" fill="url(#grid)"/>
  <g transform="translate(124 139) scale(.86)" aria-hidden="true">
    <path d="M0-88 76-44V44L0 88-76 44V-44Z" fill="#15152e" stroke="url(#edge)" stroke-width="2"/>
    <path d="M0-70 60-35V35L0 70-60 35V-35Z" fill="none" stroke="#8270c5" stroke-opacity=".45"/>
    <path d="M-24-10V-30a24 24 0 0 1 48 0V-10" fill="none" stroke="#a8fbe7" stroke-width="5"/>
    <rect x="-36" y="-10" width="72" height="52" rx="8" fill="#1e2540" stroke="url(#edge)" stroke-width="3"/>
    <circle cy="11" r="6" fill="#b5a5ff"/>
    <path d="M0 13V26" stroke="#b5a5ff" stroke-width="4"/>
    <path d="M-95 0H-84M84 0H95M0-107V-96M0 96V107" stroke="#6d718f" stroke-width="2"/>
  </g>
  <path d="M221 40V242" stroke="#373454" aria-hidden="true"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="250" y="48" font-size="22" font-weight="700" letter-spacing="3" fill="#99e6d5">QUESTLOCK</text>
    <text x="1138" y="47" text-anchor="end" font-size="18" fill="#b5a5ff">v0.2.0 · EXPERIMENTAL</text>
    <text x="248" y="105" font-size="42" font-weight="700" fill="#f4f3ff">Shared state.</text>
    <text x="248" y="153" font-size="42" font-weight="700" fill="#f4f3ff">Less repeated model work.</text>
    <text x="250" y="190" font-size="21" fill="#cbc6e2">OpenAI / Claude / local Ollama</text>
    <g fill="#14192d" stroke="#484563" aria-hidden="true">
      <rect x="250" y="219" width="170" height="38" rx="8"/>
      <rect x="474" y="219" width="150" height="38" rx="8"/>
      <rect x="678" y="219" width="184" height="38" rx="8"/>
      <rect x="916" y="219" width="166" height="38" rx="8"/>
    </g>
    <g font-size="22" text-anchor="middle" fill="#d9f8f1">
      <text x="335" y="246">Approve</text>
      <text x="549" y="246">Claim</text>
      <text x="770" y="246">Generate</text>
      <text x="999" y="246">Reuse</text>
    </g>
  </g>
  <g fill="none" stroke="#9990c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M435 238H459m-6-6 6 6-6 6"/>
    <path d="M639 238H663m-6-6 6 6-6 6"/>
    <path d="M877 238H901m-6-6 6 6-6 6"/>
  </g>
</svg>
